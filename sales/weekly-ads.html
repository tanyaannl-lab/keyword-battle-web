      <a class="workspace-module" href="../tool/index.html">

      </div>
      <nav class="workspace-subnav weekly-subnav" aria-label="每周报表子导航">
        <span class="workspace-subnav-label">利润表</span>
        <a href="./weekly-products.html#product-catalog">产品目录</a>
        <a href="./weekly-results.html#weekly-results">周结果</a>
        <details class="weekly-source-downloads" open>

          <div class="weekly-source-links">

  <div class="workspace-content">
    <header class="topbar">
      <a class="brand" href="../tool/index.html"><span class="brand-mark">K</span><span>关键词作战工具</span></a>
      <div class="top-actions">
        <span class="desktop-only" id="userEmail">—</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">退出</button>
      </div>
    </header>

    <main id="main" class="main sales-main mc-weekly">
      <p class="eyebrow">AMAZON · US MARKET</p>
      <p class="weekly-path">每周报表 <span aria-hidden="true">›</span> 利润表</p>
      <h1 id="ads-report">广告报告</h1>
      <p id="reportDescription" class="description">商品推广 · 推广的商品报告，包含 22 列，按日统计，转化指标采用 7 天归因。</p>
      <noscript><p class="notice">请启用 JavaScript 后选择报告和周次。</p></noscript>
      <section id="workspace" class="export-card" aria-label="选择广告报告和周次" hidden>
        <label class="field" for="report">
          <span>报告</span>
          <select id="report" aria-describedby="reportDescription" disabled>
            <option value="sp_advertised">商品推广 · 推广的商品</option>
            <option value="sp_placement">商品推广 · 广告位</option>
            <option value="sp_search_terms">商品推广 · 搜索词日报</option>
            <option value="sp_sis">商品推广 · 搜索词展示量份额</option>
            <option value="sb_campaign">品牌推广 · 广告活动</option>
            <option value="sd_campaign">展示型推广 · 广告活动</option>
          </select>
        </label>
        <label class="field" for="week"><span>周次</span><select id="week" disabled></select></label>
        <button type="button" class="download-btn" id="export" disabled>导出 Excel</button>
      </section>
      <p id="status" class="notice" role="status" aria-live="polite">正在读取已发布的广告报告…</p>
    </main>
  </div>
