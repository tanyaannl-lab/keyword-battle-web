<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>报告｜关键词作战工具</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    .report-state{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:42px 28px;text-align:center;color:var(--muted)}
    .report-state strong{display:block;color:var(--text);font-size:16px;margin-bottom:8px}
    .report-state.error strong{color:var(--red)}
    .report-actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
    .report-frame{width:100%;height:calc(100vh - 150px);min-height:620px;border:0;background:#fff;display:block}
    .report-frame-card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  </style>
</head>
<body>
<div id="reportGate" class="auth-loading">正在验证登录状态…</div>
<div id="reportApp" hidden>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../tool/index.html"><span class="brand-mark">K</span><span>关键词作战工具</span></a>
      <div class="top-actions"><span id="userEmail">—</span><a class="btn btn-secondary btn-sm" href="../tool/index.html">返回工具页</a></div>
    </header>

    <main class="report-wrap">
      <div class="report-toolbar">
        <div>
          <h1 style="font-size:22px;margin:0 0 6px">关键词作战总表</h1>
          <div class="report-meta" id="reportMeta">正在读取任务…</div>
        </div>
        <button class="btn btn-secondary btn-sm" id="refreshBtn">刷新报告</button>
      </div>

      <div id="stateBox" class="report-state">
        <strong>正在加载真实报告</strong>
        <div>正在验证任务归属，并获取私有 OSS 报告。</div>
      </div>

      <section id="frameCard" class="report-frame-card" hidden>
        <iframe id="reportFrame" class="report-frame" sandbox="allow-same-origin"></iframe>
      </section>
    </main>
  </div>
</div>

<script src="../assets/config.js"></script>
<script src="../assets/auth-client.js"></script>
<script src="../assets/app.js"></script>
<script src="../assets/report-client.js"></script>
<script>
(async function(){
  const auth = await KBAuth.requireAuth('../index.html');
  if(!auth) return;

  const gate = document.getElementById('reportGate');
  const app = document.getElementById('reportApp');
  const stateBox = document.getElementById('stateBox');
  const frameCard = document.getElementById('frameCard');
  const reportFrame = document.getElementById('reportFrame');
  const reportMeta = document.getElementById('reportMeta');
  const refreshBtn = document.getElementById('refreshBtn');
  const userEmail = document.getElementById('userEmail');

  userEmail.textContent = auth.user?.email || '已登录用户';
  gate.remove();
  app.hidden = false;

  const params = new URLSearchParams(location.search);
  const taskId = String(params.get('task') || '').trim();

  function showState(title, text, isError=false, extraHtml=''){
    frameCard.hidden = true;
    stateBox.hidden = false;
    stateBox.className = `report-state${isError ? ' error' : ''}`;
    stateBox.innerHTML = `<strong>${title}</strong><div>${text}</div>${extraHtml}`;
  }

  async function loadReport(){
    if(!taskId){
      showState('缺少任务号','请从“我的任务”里的“查看报告”按钮进入。',true);
      reportMeta.textContent = '任务号缺失';
      return;
    }

    refreshBtn.disabled = true;
    showState('正在加载真实报告','正在验证任务归属，并获取私有 OSS 报告。');
    reportMeta.textContent = `任务：${taskId}`;

    try{
      const currentAuth = await KBAuth.getValidSession();
      if(!currentAuth){ location.replace('../index.html'); return; }

      const result = await KBReport.getSignedReportUrl(currentAuth, taskId);
      reportMeta.textContent = `ASIN：${result.asin || '—'}　|　任务：${taskId}　|　真实 OSS 报告`;

      const html = await KBReport.fetchReportHtml(result.url);
      reportFrame.srcdoc = html;
      stateBox.hidden = true;
      frameCard.hidden = false;
    }catch(error){
      const text = KBReport.humanizeError(error);
      const corsHint = error?.code === 'OSS_CORS'
        ? '<div class="report-actions"><a class="btn btn-secondary btn-sm" href="../tool/index.html">返回工具页</a></div>'
        : '<div class="report-actions"><button class="btn btn-secondary btn-sm" id="retryBtn">重试</button></div>';
      showState('报告加载失败', text, true, corsHint);
      document.getElementById('retryBtn')?.addEventListener('click', loadReport);
    }finally{
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', loadReport);
  await loadReport();
})();
</script>
</body>
</html>
