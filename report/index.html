<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>报告｜关键词作战工具</title>

  <link rel="stylesheet" href="../assets/styles.css">

  <style>
    .report-state{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:42px 28px;
      text-align:center;
      color:var(--muted);
    }

    .report-state strong{
      display:block;
      color:var(--text);
      font-size:16px;
      margin-bottom:8px;
    }

    .report-state.error strong{
      color:var(--red);
    }

    .report-actions{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:18px;
      flex-wrap:wrap;
    }

    .report-frame{
      width:100%;
      height:calc(100vh - 150px);
      min-height:620px;
      border:0;
      background:#fff;
      display:block;
    }

    .report-frame-card{
      overflow:hidden;
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
  </style>
</head>

<body>

<div id="reportGate" class="auth-loading">
  正在验证登录状态…
</div>

<div id="reportApp" hidden>

  <div class="shell">

    <header class="topbar">

      <a
        class="brand"
        href="../tool/index.html"
      >
        <span class="brand-mark">K</span>
        <span>关键词作战工具</span>
      </a>

      <div class="top-actions">

        <span id="userEmail">—</span>

        <a
          class="btn btn-secondary btn-sm"
          href="../tool/index.html"
        >
          返回工具页
        </a>

      </div>

    </header>


    <main class="report-wrap">

      <div class="report-toolbar">

        <div>

          <h1 style="font-size:22px;margin:0 0 6px">
            关键词作战总表
          </h1>

          <div
            class="report-meta"
            id="reportMeta"
          >
            正在读取任务…
          </div>

        </div>

        <button
          class="btn btn-secondary btn-sm"
          id="refreshBtn"
        >
          刷新报告
        </button>

      </div>


      <div
        id="stateBox"
        class="report-state"
      >

        <strong>
          正在加载真实报告
        </strong>

        <div>
          正在验证任务归属，并获取私有 OSS 报告。
        </div>

      </div>


      <section
        id="frameCard"
        class="report-frame-card"
        hidden
      >

        <iframe
          id="reportFrame"
          class="report-frame"
          sandbox="allow-same-origin"
        ></iframe>

      </section>

    </main>

  </div>

</div>


<script src="../assets/config.js"></script>
<script src="../assets/auth-client.js"></script>
<script src="../assets/app.js"></script>
<script src="../assets/report-client.js"></script>


<script>
(async function(){

  const auth =
    await KBAuth.requireAuth(
      '../index.html'
    );

  if(!auth){
    return;
  }


  const gate =
    document.getElementById(
      'reportGate'
    );

  const app =
    document.getElementById(
      'reportApp'
    );

  const stateBox =
    document.getElementById(
      'stateBox'
    );

  const frameCard =
    document.getElementById(
      'frameCard'
    );

  const reportFrame =
    document.getElementById(
      'reportFrame'
    );

  const reportMeta =
    document.getElementById(
      'reportMeta'
    );

  const refreshBtn =
    document.getElementById(
      'refreshBtn'
    );

  const userEmail =
    document.getElementById(
      'userEmail'
    );


  /*
  ==========================================
  Module 01 搜索 + 筛选
  ==========================================
  */

  function installModule01Filters(){

    try{

      const doc =
        reportFrame.contentDocument;

      if(!doc){
        return;
      }


      const module01 =
        doc.getElementById(
          'module-01'
        );

      if(!module01){
        return;
      }


      /*
      防止重复安装
      */

      if(
        doc.getElementById(
          'm01ParentFilterBar'
        )
      ){
        return;
      }


      /*
      ========================================
      找到 Module 01 主表
      ========================================
      */

      const tableWrap =
        module01.querySelector(
          '.table-wrap'
        );

      if(!tableWrap){
        console.error(
          'Module 01 筛选：找不到主表容器'
        );

        return;
      }


      const mainTable =
        tableWrap.querySelector(
          'table'
        );

      if(!mainTable){
        console.error(
          'Module 01 筛选：找不到主表'
        );

        return;
      }


      /*
      ========================================
      根据表头自动定位列
      ========================================
      */

      const headers =
        Array.from(
          mainTable.querySelectorAll(
            'thead th'
          )
        ).map(
          th =>
            String(
              th.textContent || ''
            ).trim()
        );


      const keywordIndex =
        headers.indexOf(
          '关键词'
        );

      const naturalRankIndex =
        headers.indexOf(
          '自然位'
        );

      const adStatusIndex =
        headers.indexOf(
          '广告状态'
        );

      const battleIndex =
        headers.indexOf(
          '结论'
        );


      if(
        keywordIndex < 0 ||
        naturalRankIndex < 0 ||
        adStatusIndex < 0 ||
        battleIndex < 0
      ){

        console.error(
          'Module 01 筛选：没有找到所需表头',
          headers
        );

        return;
      }


      /*
      ========================================
      获取实际关键词行
      ========================================
      */

      const rows =
        Array.from(
          mainTable.querySelectorAll(
            'tbody > tr'
          )
        ).filter(
          row =>
            row.children.length ===
            headers.length
        );


      /*
      ========================================
      隐藏报告内部旧按钮筛选
      ========================================
      */

      const oldFilter =
        module01.querySelector(
          '.module01-filter-wrap'
        );

      if(oldFilter){
        oldFilter.style.display =
          'none';
      }


      /*
      把旧筛选全部恢复到“全部”
      避免旧 CSS 和新筛选冲突
      */

      const oldAdAll =
        doc.getElementById(
          'm01-ad-all'
        );

      const oldBattleAll =
        doc.getElementById(
          'm01-battle-all'
        );

      const oldRankAll =
        doc.getElementById(
          'm01-rank-all'
        );


      if(oldAdAll){
        oldAdAll.checked = true;
      }

      if(oldBattleAll){
        oldBattleAll.checked = true;
      }

      if(oldRankAll){
        oldRankAll.checked = true;
      }


      /*
      ========================================
      筛选栏样式
      ========================================
      */

      const style =
        doc.createElement(
          'style'
        );

      style.id =
        'm01ParentFilterStyle';


      style.textContent = `

        #m01ParentFilterBar{
          display:flex;
          align-items:center;
          gap:8px;

          width:100%;
          box-sizing:border-box;

          margin:0 0 10px;
          padding:8px;

          background:#fff;

          border:1px solid #e1e5e8;
          border-radius:8px;
        }


        #m01ParentFilterBar input,
        #m01ParentFilterBar select{
          height:34px;

          box-sizing:border-box;

          border:1px solid #dce2e6;
          border-radius:7px;

          background:#fff;
          color:#394550;

          font-size:12px;

          padding:0 10px;

          outline:none;

          transition:
            border-color .15s ease,
            box-shadow .15s ease;
        }


        #m01ParentFilterBar input{
          width:220px;
          min-width:180px;
        }


        #m01ParentFilterBar select{
          min-width:125px;
          cursor:pointer;
        }


        #m01ParentFilterBar input:hover,
        #m01ParentFilterBar select:hover{
          border-color:#b9c5ca;
        }


        #m01ParentFilterBar input:focus,
        #m01ParentFilterBar select:focus{
          border-color:#159d84;

          box-shadow:
            0 0 0 2px
            rgba(21,157,132,.10);
        }


        #m01KeywordSearch::placeholder{
          color:#9aa3aa;
        }


        #m01FilterCount{
          margin-left:auto;

          color:#7a8491;

          font-size:11px;
          font-weight:600;

          white-space:nowrap;
        }


        @media(max-width:900px){

          #m01ParentFilterBar{
            overflow-x:auto;
          }

          #m01ParentFilterBar input{
            min-width:190px;
          }

          #m01ParentFilterBar select{
            min-width:125px;
          }

          #m01FilterCount{
            padding-right:6px;
          }

        }

      `;


      doc.head.appendChild(
        style
      );


      /*
      ========================================
      创建筛选栏
      ========================================
      */

      const bar =
        doc.createElement(
          'div'
        );

      bar.id =
        'm01ParentFilterBar';


      bar.innerHTML = `

        <input
          id="m01KeywordSearch"
          type="search"
          placeholder="搜索关键词……"
          autocomplete="off"
        >


        <select id="m01AdSelect">

          <option value="all">
            广告：全部
          </option>

          <option value="on">
            有投放
          </option>

          <option value="off">
            无投放
          </option>

        </select>


        <select id="m01BattleSelect">

          <option value="all">
            结论：全部
          </option>

          <option value="守住">
            守住
          </option>

          <option value="控损">
            控损
          </option>

          <option value="放大">
            放大
          </option>

          <option value="谨慎硬投">
            谨慎硬投
          </option>

          <option value="小额测试">
            小额测试
          </option>

          <option value="继续观察">
            继续观察
          </option>

        </select>


        <select id="m01RankSelect">

          <option value="all">
            自然位：全部
          </option>

          <option value="top10">
            Top10
          </option>

          <option value="mid">
            11–30
          </option>

          <option value="poor">
            30+
          </option>

          <option value="none">
            未上榜
          </option>

        </select>


        <span id="m01FilterCount">
          显示 ${rows.length}/${rows.length}
        </span>

      `;


      /*
      放在主表正上方
      */

      module01.insertBefore(
        bar,
        tableWrap
      );


      /*
      ========================================
      获取控件
      ========================================
      */

      const search =
        doc.getElementById(
          'm01KeywordSearch'
        );

      const adSelect =
        doc.getElementById(
          'm01AdSelect'
        );

      const battleSelect =
        doc.getElementById(
          'm01BattleSelect'
        );

      const rankSelect =
        doc.getElementById(
          'm01RankSelect'
        );

      const count =
        doc.getElementById(
          'm01FilterCount'
        );


      /*
      ========================================
      工具函数
      ========================================
      */

      function getCellText(
        row,
        index
      ){

        return String(
          row.children[index]
            ?.textContent || ''
        ).trim();

      }


      /*
      ========================================
      核心筛选函数
      ========================================
      */

      function applyFilters(){

        /*
        搜索词
        */

        const keyword =
          String(
            search.value || ''
          )
            .trim()
            .toLowerCase();


        /*
        当前筛选条件
        */

        const adValue =
          adSelect.value;

        const battleValue =
          battleSelect.value;

        const rankValue =
          rankSelect.value;


        let visible = 0;


        rows.forEach(row => {

          /*
          ====================================
          关键词
          ====================================
          */

          const rowKeyword =
            getCellText(
              row,
              keywordIndex
            ).toLowerCase();


          const keywordOk =
            keyword === '' ||
            rowKeyword.includes(
              keyword
            );


          /*
          ====================================
          广告状态
          ====================================
          */

          const adText =
            getCellText(
              row,
              adStatusIndex
            );


          let adOk = true;


          if(adValue === 'on'){

            adOk =
              adText.includes(
                '有投放'
              );

          }


          if(adValue === 'off'){

            adOk =
              adText.includes(
                '无投放'
              ) ||
              !adText.includes(
                '有投放'
              );

          }


          /*
          ====================================
          作战结论
          ====================================
          */

          const battleText =
            getCellText(
              row,
              battleIndex
            );


          const battleOk =
            battleValue === 'all' ||
            battleText.includes(
              battleValue
            );


          /*
          ====================================
          自然位
          ====================================
          */

          const rankText =
            getCellText(
              row,
              naturalRankIndex
            );


          /*
          页面自然位可能是：
          1
          23
          无
          —
          */

          const rankMatch =
            rankText.match(
              /^\s*(\d+)/
            );


          const rank =
            rankMatch
              ? Number(
                  rankMatch[1]
                )
              : null;


          let rankOk = true;


          if(rankValue === 'top10'){

            rankOk =
              rank !== null &&
              rank >= 1 &&
              rank <= 10;

          }


          if(rankValue === 'mid'){

            rankOk =
              rank !== null &&
              rank >= 11 &&
              rank <= 30;

          }


          if(rankValue === 'poor'){

            rankOk =
              rank !== null &&
              rank > 30;

          }


          if(rankValue === 'none'){

            rankOk =
              rank === null;

          }


          /*
          ====================================
          四个条件同时满足
          ====================================
          */

          const show =
            keywordOk &&
            adOk &&
            battleOk &&
            rankOk;


          row.style.display =
            show
              ? ''
              : 'none';


          if(show){
            visible += 1;
          }

        });


        /*
        更新显示数量
        */

        count.textContent =
          `显示 ${visible}/${rows.length}`;

      }


      /*
      ========================================
      绑定事件
      ========================================
      */

      search.addEventListener(
        'input',
        applyFilters
      );


      adSelect.addEventListener(
        'change',
        applyFilters
      );


      battleSelect.addEventListener(
        'change',
        applyFilters
      );


      rankSelect.addEventListener(
        'change',
        applyFilters
      );


      /*
      初始化
      */

      applyFilters();


    }catch(error){

      console.error(
        '安装 Module 01 筛选失败：',
        error
      );

    }

  }


  /*
  ==========================================
  iframe 每次载入报告后安装筛选
  ==========================================
  */

  reportFrame.addEventListener(
    'load',
    installModule01Filters
  );


  /*
  ==========================================
  原页面逻辑
  ==========================================
  */

  userEmail.textContent =
    auth.user?.email ||
    '已登录用户';


  gate.remove();

  app.hidden = false;


  const params =
    new URLSearchParams(
      location.search
    );


  const taskId =
    String(
      params.get('task') || ''
    ).trim();


  function showState(
    title,
    text,
    isError=false,
    extraHtml=''
  ){

    frameCard.hidden = true;

    stateBox.hidden = false;


    stateBox.className =
      `report-state${
        isError
          ? ' error'
          : ''
      }`;


    stateBox.innerHTML =
      `<strong>${title}</strong>
       <div>${text}</div>
       ${extraHtml}`;

  }


  /*
  ==========================================
  加载报告
  ==========================================
  */

  async function loadReport(){

    if(!taskId){

      showState(
        '缺少任务号',
        '请从“我的任务”里的“查看报告”按钮进入。',
        true
      );


      reportMeta.textContent =
        '任务号缺失';


      return;
    }


    refreshBtn.disabled = true;


    showState(
      '正在加载真实报告',
      '正在验证任务归属，并获取私有 OSS 报告。'
    );


    reportMeta.textContent =
      `任务：${taskId}`;


    try{

      const currentAuth =
        await KBAuth.getValidSession();


      if(!currentAuth){

        location.replace(
          '../index.html'
        );

        return;
      }


      const result =
        await KBReport.getSignedReportUrl(
          currentAuth,
          taskId
        );


      reportMeta.textContent =
        `ASIN：${
          result.asin || '—'
        }　|　任务：${
          taskId
        }　|　真实 OSS 报告`;


      const html =
        await KBReport.fetchReportHtml(
          result.url
        );


      /*
      OSS 报告写入 iframe
      */

      reportFrame.srcdoc =
        html;


      stateBox.hidden =
        true;


      frameCard.hidden =
        false;


    }catch(error){

      const text =
        KBReport.humanizeError(
          error
        );


      const corsHint =
        error?.code ===
        'OSS_CORS'

          ? `
            <div class="report-actions">

              <a
                class="btn btn-secondary btn-sm"
                href="../tool/index.html"
              >
                返回工具页
              </a>

            </div>
          `

          : `
            <div class="report-actions">

              <button
                class="btn btn-secondary btn-sm"
                id="retryBtn"
              >
                重试
              </button>

            </div>
          `;


      showState(
        '报告加载失败',
        text,
        true,
        corsHint
      );


      document
        .getElementById(
          'retryBtn'
        )
        ?.addEventListener(
          'click',
          loadReport
        );


    }finally{

      refreshBtn.disabled =
        false;

    }

  }


  /*
  刷新报告
  */

  refreshBtn.addEventListener(
    'click',
    loadReport
  );


  /*
  初始加载
  */

  await loadReport();


})();
</script>

</body>
</html>
